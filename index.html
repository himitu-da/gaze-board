<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>視線入力ボード</title>
<style>
:root{--bg:#0f1115;--fg:#f2f4f8;--cell:#1b1f27;--cell-b:#2a3040;--acc:#3ea6ff;--ctl:#ffd479}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{flex:0 0 auto;padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--cell-b)}
#msgRow{display:flex;gap:8px;align-items:center}
#msg{flex:1;min-height:2.6em;font-size:clamp(18px,5.5vw,28px);line-height:1.25;padding:6px 10px;background:#000;border-radius:10px;
  overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#msg.empty{color:#555;font-size:15px;display:flex;align-items:center}
#preview{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:10px;transform:scaleX(-1);background:#000;border:3px solid #444}
#preview.ok{border-color:#2ecc71}#preview.ng{border-color:#e74c3c}
#ctrl{display:flex;gap:6px;align-items:center;font-size:12px;color:#aab}
#ctrl button{font:inherit;color:var(--fg);background:var(--cell);border:1px solid var(--cell-b);border-radius:8px;padding:6px 8px;white-space:nowrap}
#status{margin-left:auto;white-space:pre-line;text-align:right;line-height:1.25;font-size:11px}
.ver{color:#7f8aa3;font-size:13px;font-weight:400}
#tune{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:rgba(15,17,21,.95);border-top:1px solid var(--cell-b);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:15px}
#tune.show{display:block}
#tune .row{display:flex;align-items:center;gap:10px;margin:6px 0}
#tune .row label{flex:0 0 7.5em}
#tune .row b{flex:0 0 3.6em;text-align:right;font-variant-numeric:tabular-nums}
#tune input[type=range]{flex:1;height:34px;accent-color:var(--acc)}
#tune .chk{gap:22px}
#tune .chk label{flex:none;display:flex;align-items:center;gap:6px}
#tune .chk input{width:22px;height:22px}
#tune .btns button{flex:1;font:inherit;color:var(--fg);background:var(--cell);border:1px solid var(--cell-b);border-radius:10px;padding:10px}
#tune .btns button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#tune .hint{margin:4px 0 0;color:#99a;font-size:12px}
#grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:8px}
.cell{position:relative;overflow:hidden;background:var(--cell);border:3px solid var(--cell-b);border-radius:16px;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(18px,6.2vw,36px);font-weight:700;padding:4px;--p:0}
.cell::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);background:rgba(62,166,255,.38)}
.cell span{position:relative;line-height:1.15}
.cell.kana{font-size:clamp(28px,11vw,56px)}
.cell.ctl{color:var(--ctl);font-size:clamp(15px,4.8vw,26px)}
.cell.hot{border-color:var(--acc)}
.cell.empty{opacity:.2}
.cell.fire{animation:fire .4s ease-out}
@keyframes fire{0%{background:var(--acc)}100%{background:var(--cell)}}
#dot{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:rgba(255,80,80,.5);border:2px solid #fff;pointer-events:none;z-index:50;display:none}
.screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));text-align:center;gap:14px;overflow:auto}
.screen.show{display:flex}
.screen h1{margin:0;font-size:26px}
.screen ul{text-align:left;margin:0;padding-left:1.2em;line-height:1.6;color:#c8ccd6;font-size:15px;max-width:30em}
.big{font:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--acc);border:0;border-radius:14px;padding:14px 22px;min-width:240px}
.big.sub{background:var(--cell);border:1px solid var(--cell-b)}
#err{color:#ff8080;font-size:14px;max-width:30em;white-space:pre-wrap}
#calib{background:#000;z-index:120}
#target{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#ff4757;
  box-shadow:0 0 0 8px rgba(255,71,87,.25);transition:left .45s ease,top .45s ease}
#target::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
#target.collect{animation:shrink 1.2s linear forwards}
@keyframes shrink{to{transform:scale(.4)}}
#calibMsg{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top));color:#999;font-size:13px;text-align:center;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222a;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border:1px solid #444;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:200;
  max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div id="msgRow">
      <div id="msg" class="empty">ここに文が表示されます（ここを見ている間は何も選ばれません）</div>
      <video id="preview" playsinline muted autoplay></video>
    </div>
    <div id="ctrl">
      <button id="recalBtn">再調整</button>
      <button id="tuneBtn">⚙ 感度</button>
      <button id="dotBtn">点:表示</button>
      <button id="dwellBtn">1.2秒</button>
      <span id="status">-</span>
    </div>
  </div>
  <div id="grid"></div>
</div>
<div id="dot"></div>

<div id="tune">
  <div class="row"><label>左右の感度</label><input type="range" id="tGx" min="0.5" max="3" step="0.1"><b id="tGxV"></b></div>
  <div class="row"><label>上下の感度</label><input type="range" id="tGy" min="0.5" max="3" step="0.1"><b id="tGyV"></b></div>
  <div class="row"><label>左右の位置</label><input type="range" id="tOx" min="-30" max="30" step="1"><b id="tOxV"></b></div>
  <div class="row"><label>上下の位置</label><input type="range" id="tOy" min="-30" max="30" step="1"><b id="tOyV"></b></div>
  <div class="row chk"><label><input type="checkbox" id="tFx">左右反転</label><label><input type="checkbox" id="tFy">上下反転</label></div>
  <div class="row btns"><button id="tuneReset">初期値に戻す</button><button id="tuneClose" class="pri">閉じる</button></div>
  <p class="hint">赤い点（視線）が見ている場所に重なるように調整してください。開いている間は選択されません。<br>感度：大きくすると点がよく動きます／位置：点全体をずらします。</p>
</div>

<div id="start" class="screen show">
  <h1>視線入力ボード <span class="ver" id="verStart"></span></h1>
  <ul>
    <li>明るい場所で、スマホを顔の正面 30〜40cm に<b>固定</b>してください（スタンドや物に立てかける）。</li>
    <li>調整では、頭を動かさずに<b>赤い点を目だけで</b>追ってください。</li>
    <li>ボタンを約1.2秒見つめると選択されます。上の文字欄を見ている間は何も選ばれません。</li>
    <li>映像は端末内だけで処理され、どこにも送信されません。</li>
  </ul>
  <button id="startBtn" class="big">カメラを起動して調整する</button>
  <button id="resumeBtn" class="big sub" style="display:none">前回の調整で始める</button>
  <div id="err"></div>
</div>

<div id="calib" class="screen">
  <div id="calibMsg"></div>
  <div id="target"></div>
</div>

<div id="toast"></div>

<script type="module">
// ---------------- 設定 ----------------
const APP_VERSION = "v1.1.0";
const VER = "0.10.14";
const LIB = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`;
const WASM = `${LIB}/wasm`;
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const DWELLS = [800, 1200, 1600, 2000];
const SNAKE = [0, 1, 2, 5, 4, 3, 6, 7, 8];          // キャリブレーション順
const FLOOR = [.02, .02, .02, .02, .03, .03, .03, .03, .01]; // 特徴量ごとの標準偏差の下限

const $ = id => document.getElementById(id);
const video = $("preview"), grid = $("grid"), dotEl = $("dot"), msgEl = $("msg");
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------------- 数学ユーティリティ ----------------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const dot2 = (a, b) => a[0] * b[0] + a[1] * b[1];
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const len = a => Math.hypot(a[0], a[1]);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dotv = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

// 顔ランドマーク(478点)から視線の特徴量を作る。目の軸で正規化するので頭の傾きに強い。
function features(lm, vw, vh) {
  const P = i => [lm[i].x * vw, lm[i].y * vh];
  function eye(L, R, U, D, I) {
    const l = P(L), r = P(R), c = mid(l, r), w = len(sub(r, l));
    const u = [(r[0] - l[0]) / w, (r[1] - l[1]) / w], v = [-u[1], u[0]];
    const d = sub(P(I), c), up = P(U), dn = P(D);
    return { dx: dot2(d, u) / w, dy: dot2(d, v) / w, open: dot2(sub(dn, up), v) / w, lid: dot2(sub(mid(up, dn), c), v) / w };
  }
  const a = eye(33, 133, 159, 145, 468), b = eye(362, 263, 386, 374, 473);
  const l = P(33), r = P(263), m = mid(l, r), io = len(sub(r, l));
  const u = [(r[0] - l[0]) / io, (r[1] - l[1]) / io], v = [-u[1], u[0]];
  const n = sub(P(1), m);
  const open = (a.open + b.open) / 2;
  return {
    open,
    f: [(a.dx + b.dx) / 2, (a.dy + b.dy) / 2, open, (a.lid + b.lid) / 2,
        dot2(n, u) / io, dot2(n, v) / io, m[0] / vw, m[1] / vh, io / vw],
  };
}

function solve(A, b) { // ガウスの消去法（部分ピボット）
  const n = b.length, M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-12;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const k = M[r][c] / d;
      for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
    }
  }
  return M.map((row, i) => row[n] / (row[i] || 1e-12));
}

function normalize(m, f) { return f.map((v, i) => clamp((v - m.mean[i]) / m.std[i], -5, 5)); }

// リッジ回帰で 特徴量 → 画面座標(x, y) を学習
function fitModel(samples, lambdaRatio = 0.02) {
  const d = samples[0].f.length, n = samples.length;
  const mean = Array(d).fill(0), std = Array(d).fill(0);
  for (const s of samples) s.f.forEach((v, i) => mean[i] += v / n);
  for (const s of samples) s.f.forEach((v, i) => std[i] += (v - mean[i]) ** 2 / n);
  for (let i = 0; i < d; i++) std[i] = Math.max(Math.sqrt(std[i]), FLOOR[i] ?? 0.01);
  const m = { mean, std };
  const D = d + 1, A = Array.from({ length: D }, () => Array(D).fill(0)), bx = Array(D).fill(0), by = Array(D).fill(0);
  for (const s of samples) {
    const z = [1, ...normalize(m, s.f)];
    for (let i = 0; i < D; i++) {
      bx[i] += z[i] * s.x; by[i] += z[i] * s.y;
      for (let j = 0; j < D; j++) A[i][j] += z[i] * z[j];
    }
  }
  for (let i = 1; i < D; i++) A[i][i] += lambdaRatio * n;
  m.wx = solve(A, bx); m.wy = solve(A, by);
  return m;
}
function predict(m, f) { const z = [1, ...normalize(m, f)]; return [dotv(z, m.wx), dotv(z, m.wy)]; }

// 外れ値（瞬き・視線のブレ）を除いて、各点の中心に近いサンプルだけ残す
function trimSamples(list, keep = 0.7) {
  if (list.length < 4) return list;
  const med = k => { const s = list.map(f => f[k]).sort((a, b) => a - b); return s[s.length >> 1]; };
  const mx = med(0), my = med(1);
  return list.map(f => ({ f, d: Math.hypot(f[0] - mx, f[1] - my) }))
    .sort((a, b) => a.d - b.d).slice(0, Math.max(3, Math.round(list.length * keep))).map(o => o.f);
}

class OneEuro { // 低遅延のジッター除去フィルタ
  constructor(minCut, beta, dCut = 1) { Object.assign(this, { minCut, beta, dCut }); this.reset(); }
  reset() { this.t = null; this.x = 0; this.dx = 0; }
  static a(cut, dt) { const tau = 1 / (2 * Math.PI * cut); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.t === null) { this.t = t; this.x = v; return v; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx += OneEuro.a(this.dCut, dt) * ((v - this.x) / dt - this.dx);
    this.x += OneEuro.a(this.minCut + this.beta * Math.abs(this.dx), dt) * (v - this.x);
    return this.x;
  }
}

// ---------------- ボードの内容 ----------------
const KANA = {
  "あ": "あいうえお", "か": "かきくけこ", "さ": "さしすせそ", "た": "たちつてと", "な": "なにぬねの",
  "は": "はひふへほ", "ま": "まみむめも", "や": "やゆよ", "ら": "らりるれろ", "わ": "わをん",
};
const CYCLES = ["かが", "きぎ", "くぐ", "けげ", "こご", "さざ", "しじ", "すず", "せぜ", "そぞ", "ただ", "ちぢ", "つっづ", "てで", "とど",
  "はばぱ", "ひびぴ", "ふぶぷ", "へべぺ", "ほぼぽ", "あぁ", "いぃ", "うぅゔ", "えぇ", "おぉ", "やゃ", "ゆゅ", "よょ", "わゎ"];
function cycleLast(text) {
  if (!text) return text;
  const ch = text.at(-1), s = CYCLES.find(s => s.includes(ch));
  if (!s) return text;
  return text.slice(0, -1) + s[(s.indexOf(ch) + 1) % s.length];
}

const ph = t => ({ label: t, act: "phrase", val: t });
const ctl = (label, act, val) => ({ label, act, val, cls: "ctl" });
const EMPTY = { label: "", act: null, cls: "empty" };
const MOD = ctl("゛ ゜ 小", "mod"), BS = ctl("⌫ 1字消す", "bs"), SPEAK = ctl("🔊 読み上げ", "speak");

function cellsFor(v) {
  if (v.type === "phrase" && v.page === 0) return [ph("はい"), ph("いいえ"), ph("ありがとう"), ph("痛い"), ph("トイレ"), ph("助けて"),
    ctl("あいう 文字入力", "go", { type: "kanaG", page: 0 }), SPEAK, ctl("次へ ▶", "go", { type: "phrase", page: 1 })];
  if (v.type === "phrase") return [ph("暑い"), ph("寒い"), ph("ちょっと待って"), ph("水がほしい"), ph("眠い"), ph("大丈夫"),
    ph("人を呼んで"), ctl("✕ 消す", "clear"), ctl("◀ 戻る", "go", { type: "phrase", page: 0 })];
  if (v.type === "kanaG" && v.page === 0) return [..."あかさたなはまや"].map(g => ({ label: g, act: "go", val: { type: "kana", g }, cls: "kana" }))
    .concat(ctl("ら わ ー ▶", "go", { type: "kanaG", page: 1 }));
  if (v.type === "kanaG") return [{ label: "ら", act: "go", val: { type: "kana", g: "ら" }, cls: "kana" },
    { label: "わ", act: "go", val: { type: "kana", g: "わ" }, cls: "kana" }, { label: "ー", act: "char", val: "ー", cls: "kana" },
    MOD, BS, SPEAK, ctl("✕ 全消去", "clear"), ctl("定型文", "go", { type: "phrase", page: 0 }), ctl("◀ 戻る", "go", { type: "kanaG", page: 0 })];
  // かなの行
  const chars = [...KANA[v.g]].map(c => ({ label: c, act: "char", val: c, cls: "kana" }));
  while (chars.length < 5) chars.push(EMPTY);
  return [...chars, MOD, BS, SPEAK, ctl("◀ 戻る", "go", { type: "kanaG", page: 0 })];
}

// ---------------- 状態 ----------------
let landmarker = null, model = null, mode = "start";
let view = { type: "phrase", page: 0 }, cells = [], rects = [];
let message = "";
let dwellMs = store.get("dwellMs") || 1200, showDot = store.get("showDot") ?? true;
const fx = new OneEuro(0.5, 0.003), fy = new OneEuro(0.5, 0.003);
const dwell = { idx: null, p: 0 }; let lockUntil = 0, lastT = 0;
let faceOk = false, frames = 0, fpsT = performance.now(), fps = 0;
let collecting = null; // キャリブレーション中のサンプル配列
const TUNE_DEF = { gx: 1, gy: 1, ox: 0, oy: 0, flipX: false, flipY: false };
let tune = { ...TUNE_DEF, ...(store.get("tune") || {}) }, tuning = false;

// 感度・位置・反転の補正。中心はキャリブレーション点の中心（＝ボードの中心）
function applyTune(x, y) {
  const cx = model?.cx ?? innerWidth / 2, cy = model?.cy ?? innerHeight / 2;
  let dx = (x - cx) * tune.gx, dy = (y - cy) * tune.gy;
  if (tune.flipX) dx = -dx;
  if (tune.flipY) dy = -dy;
  return [cx + dx + tune.ox / 100 * innerWidth, cy + dy + tune.oy / 100 * innerHeight];
}

function toast(text, ms = 3000) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms);
}

function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; speechSynthesis.speak(u);
}

function renderMsg() {
  msgEl.textContent = message || "ここに文が表示されます（ここを見ている間は何も選ばれません）";
  msgEl.classList.toggle("empty", !message);
}

function render() {
  cells = cellsFor(view);
  grid.innerHTML = "";
  cells.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "cell " + (c.cls || "");
    el.innerHTML = `<span>${c.label}</span>`;
    el.addEventListener("pointerup", () => c.act && activate(i)); // タップでも操作可能
    grid.appendChild(el);
  });
  dwell.idx = null; dwell.p = 0;
  measure();
}
function measure() { rects = [...grid.children].map(el => el.getBoundingClientRect()); }
function cellAt(x, y) {
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cells[i]?.act ? i : null;
  }
  return null;
}

function activate(i) {
  const c = cells[i]; if (!c?.act) return;
  const el = grid.children[i];
  el?.classList.remove("fire"); void el?.offsetWidth; el?.classList.add("fire");
  navigator.vibrate?.(30);
  switch (c.act) {
    case "phrase": message = c.val; speak(c.val); break;
    case "char": message += c.val; speak(c.val); if (view.type === "kana") view = { type: "kanaG", page: 0 }; break;
    case "mod": message = cycleLast(message); break;
    case "bs": message = [...message].slice(0, -1).join(""); break;
    case "clear": message = ""; break;
    case "speak": speak(message || "メッセージはありません"); break;
    case "go": view = c.val; break;
  }
  renderMsg();
  if (c.act === "go" || (c.act === "char" && view.type === "kanaG")) setTimeout(render, 150);
  lockUntil = performance.now() + 700;
}

// ---------------- 視線 → 選択 ----------------
function setHot(idx, p) {
  [...grid.children].forEach((el, i) => {
    el.classList.toggle("hot", i === idx);
    el.style.setProperty("--p", i === idx ? clamp(p, 0, 1).toFixed(3) : 0);
  });
}

function onGaze(F, t) {
  const dt = Math.min(120, t - lastT); lastT = t;
  if (F.open < model.openBase * 0.45) return; // 瞬き中は保持
  let [x, y] = predict(model, F.f);
  [x, y] = applyTune(fx.filter(x, t / 1000), fy.filter(y, t / 1000));
  x = clamp(x, 0, innerWidth); y = clamp(y, 0, innerHeight);
  if (showDot || tuning) { dotEl.style.display = "block"; dotEl.style.transform = `translate(${x}px,${y}px)`; }
  if (tuning || t < lockUntil) { dwell.p = 0; dwell.idx = null; setHot(null, 0); return; }
  const idx = cellAt(x, y);
  if (idx !== null && idx === dwell.idx) dwell.p += dt;
  else { dwell.p -= dt * 1.5; if (dwell.p <= 0) { dwell.idx = idx; dwell.p = 0; } }
  setHot(dwell.idx, dwell.p / dwellMs);
  if (dwell.idx !== null && dwell.p >= dwellMs) { const i = dwell.idx; dwell.idx = null; dwell.p = 0; setHot(null, 0); activate(i); }
}

function onNoFace(t) {
  const dt = Math.min(120, t - lastT); lastT = t;
  if (mode === "board" && dwell.idx !== null) {
    dwell.p = Math.max(0, dwell.p - dt * 1.5); setHot(dwell.idx, dwell.p / dwellMs);
  }
}

// ---------------- カメラ・検出ループ ----------------
async function createLandmarker() {
  const { FaceLandmarker, FilesetResolver } = await import(`${LIB}/vision_bundle.mjs`);
  const files = await FilesetResolver.forVisionTasks(WASM);
  const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numFaces: 1 });
  try { return await FaceLandmarker.createFromOptions(files, opts("GPU")); }
  catch { return await FaceLandmarker.createFromOptions(files, opts("CPU")); }
}

let lastVideoTime = -1;
function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const t = performance.now();
  let res; try { res = landmarker.detectForVideo(video, t); } catch { return; }
  frames++; if (t - fpsT > 1000) { fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
  const lm = res.faceLandmarks?.[0];
  faceOk = !!lm && lm.length >= 478;
  video.className = faceOk ? "ok" : "ng";
  $("status").textContent = `${APP_VERSION}\n${faceOk ? "顔OK" : "顔なし"} ${fps}fps`;
  if (!faceOk) return onNoFace(t);
  const F = features(lm, video.videoWidth, video.videoHeight);
  if (mode === "calib" && collecting && F.open > 0.08) collecting.push(F.f);
  else if (mode === "board" && model) onGaze(F, t);
}

const wait = ms => new Promise(r => setTimeout(r, ms));
async function waitFace(label) {
  const msg = $("calibMsg");
  let okSince = 0;
  while (true) {
    const now = performance.now();
    if (faceOk) { okSince ||= now; if (now - okSince > 600) return; } else okSince = 0;
    msg.textContent = faceOk ? label : "顔が見つかりません。カメラに顔を映してください";
    await wait(100);
  }
}

async function calibrate() {
  mode = "calib"; dotEl.style.display = "none";
  view = view.type === "kana" ? { type: "kanaG", page: 0 } : view; render();
  const centers = rects.map(r => [(r.left + r.right) / 2, (r.top + r.bottom) / 2]);
  const scr = $("calib"), tg = $("target"), msg = $("calibMsg");
  scr.classList.add("show");
  tg.style.transition = "none"; tg.style.left = centers[SNAKE[0]][0] + "px"; tg.style.top = centers[SNAKE[0]][1] + "px";
  void tg.offsetWidth; tg.style.transition = "";
  await waitFace("頭を動かさず、赤い点を目で追ってください");
  const samples = [], opens = [];
  for (let k = 0; k < SNAKE.length; k++) {
    const [x, y] = centers[SNAKE[k]];
    tg.classList.remove("collect"); tg.style.left = x + "px"; tg.style.top = y + "px";
    msg.textContent = `赤い点を見てください（${k + 1}/${SNAKE.length}）`;
    await wait(750);                         // 移動＋視線の到達待ち
    tg.classList.add("collect"); collecting = [];
    const t0 = performance.now();
    while (collecting.length < 30 && performance.now() - t0 < 5000) await wait(40);
    const got = trimSamples(collecting); collecting = null;
    if (got.length < 5) { k--; await waitFace("顔が見つかりません。カメラに顔を映してください"); continue; }
    got.forEach(f => { samples.push({ f, x, y }); opens.push(f[2]); });
  }
  scr.classList.remove("show"); tg.classList.remove("collect");
  model = fitModel(samples);
  model.openBase = opens.reduce((a, b) => a + b, 0) / opens.length;
  model.w = innerWidth; model.h = innerHeight;
  model.cx = centers.reduce((s, c) => s + c[0], 0) / centers.length;
  model.cy = centers.reduce((s, c) => s + c[1], 0) / centers.length;
  const err = samples.reduce((s, o) => { const [px, py] = predict(model, o.f); return s + Math.hypot(px - o.x, py - o.y); }, 0) / samples.length;
  // 調整し直したら感度補正はリセット（新しいモデルには前の補正が合わないため）
  if (JSON.stringify(tune) !== JSON.stringify(TUNE_DEF)) { tune = { ...TUNE_DEF }; store.set("tune", tune); syncTune(); }
  store.set("gazeModel", model);
  const cellMin = Math.min(rects[0].width, rects[0].height);
  toast(`調整完了：平均誤差 約${Math.round(err)}px` + (err > cellMin * 0.4 ? "（大きめです。再調整をおすすめします）" : ""), 4000);
  fx.reset(); fy.reset(); lastT = performance.now(); lockUntil = lastT + 800;
  mode = "board";
}

let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode !== "start") keepAwake(); });

async function boot(useSaved) {
  const err = $("err"); err.textContent = "";
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    err.textContent = "カメラを使うには HTTPS で開く必要があります（GitHub Pages などで公開してください）。"; return;
  }
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {} // iOSの読み上げ解禁
  $("startBtn").disabled = $("resumeBtn").disabled = true;
  try {
    err.textContent = "カメラを起動しています…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream; await video.play();
    if (!landmarker) { err.textContent = "顔検出モデルを読み込んでいます…（初回は数秒かかります）"; landmarker = await createLandmarker(); }
  } catch (e) {
    err.textContent = (e.name === "NotAllowedError" ? "カメラの使用が許可されませんでした。ブラウザの設定で許可してください。" : "起動に失敗しました: ") + (e.message || e);
    $("startBtn").disabled = $("resumeBtn").disabled = false; return;
  }
  keepAwake();
  $("start").classList.remove("show");
  requestAnimationFrame(loop);
  render();
  if (useSaved && savedModel()) { model = savedModel(); mode = "board"; lastT = performance.now(); toast("前回の調整を使っています。ずれる場合は「再調整」"); }
  else await calibrate();
}

function savedModel() {
  const m = store.get("gazeModel");
  return m && Math.abs(m.w - innerWidth) < 40 && Math.abs(m.h - innerHeight) < 80 ? m : null;
}

// ---------------- UI ----------------
function updateCtrl() {
  $("dotBtn").textContent = `点:${showDot ? "表示" : "非表示"}`;
  $("dwellBtn").textContent = `${dwellMs / 1000}秒`;
  if (!showDot && !tuning) dotEl.style.display = "none";
}

// 感度パネル
const TUNE_UI = [["tGx", "gx", v => `×${v.toFixed(1)}`], ["tGy", "gy", v => `×${v.toFixed(1)}`],
  ["tOx", "ox", v => `${v > 0 ? "+" : ""}${v}%`], ["tOy", "oy", v => `${v > 0 ? "+" : ""}${v}%`]];
function syncTune() {
  for (const [id, k, fmt] of TUNE_UI) { $(id).value = tune[k]; $(id + "V").textContent = fmt(tune[k]); }
  $("tFx").checked = tune.flipX; $("tFy").checked = tune.flipY;
}
for (const [id, k, fmt] of TUNE_UI) $(id).addEventListener("input", e => {
  tune[k] = Number(e.target.value); $(id + "V").textContent = fmt(tune[k]); store.set("tune", tune);
});
$("tFx").onchange = e => { tune.flipX = e.target.checked; store.set("tune", tune); };
$("tFy").onchange = e => { tune.flipY = e.target.checked; store.set("tune", tune); };
$("tuneReset").onclick = () => { tune = { ...TUNE_DEF }; store.set("tune", tune); syncTune(); };
function setTuning(on) {
  tuning = on; $("tune").classList.toggle("show", on);
  if (!on) { lockUntil = performance.now() + 600; updateCtrl(); }
}
$("tuneBtn").onclick = () => setTuning(!tuning);
$("tuneClose").onclick = () => setTuning(false);
$("verStart").textContent = APP_VERSION;
$("status").textContent = APP_VERSION;
syncTune();
$("startBtn").onclick = () => boot(false);
$("resumeBtn").onclick = () => boot(true);
$("recalBtn").onclick = () => { if (mode === "board") { setTuning(false); calibrate(); } };
$("dotBtn").onclick = () => { showDot = !showDot; store.set("showDot", showDot); updateCtrl(); };
$("dwellBtn").onclick = () => { dwellMs = DWELLS[(DWELLS.indexOf(dwellMs) + 1) % DWELLS.length]; store.set("dwellMs", dwellMs); updateCtrl(); };
addEventListener("resize", () => {
  measure();
  if (model && mode === "board" && (Math.abs(model.w - innerWidth) > 40 || Math.abs(model.h - innerHeight) > 80))
    toast("画面サイズが変わりました。「再調整」してください", 4000);
});
if (savedModel()) $("resumeBtn").style.display = "";
updateCtrl(); renderMsg(); render();

// テスト用に公開
window.__gaze = { applyTune, getTune: () => tune, fitModel, predict, trimSamples, cycleLast, cellsFor, OneEuro, features };
</script>
